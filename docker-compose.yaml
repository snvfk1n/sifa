services:
  sifa:
    image: ghcr.io/snvfk1n/sifa:latest
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    env_file:
      - .env
    volumes:
      - data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-3010}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  data:
